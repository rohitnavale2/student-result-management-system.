{% extends "admin_base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Edit Student</h3>
        <a href="{% url 'manage_students' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Student ID</label>
                        <input type="text" name="student_id" class="form-control"
                               value="{{ student.student_id }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control"
                               value="{{ student.full_name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ student.email }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ student.phone }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Class</label>
                        <select name="class_name" class="form-select" required>
                            <option value="">Select Class</option>
                            {% for class in classes %}
                                <option value="{{ class.id }}"
                                    {% if student.class_name_id == class.id %}selected{% endif %}>
                                    {{ class.class_name }} - {{ class.section }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Roll Number</label>
                        <input type="text" name="roll_number" class="form-control"
                               value="{{ student.roll_number }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="form-control"
                               value="{{ student.date_of_birth|date:'Y-m-d' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option value="Male" {% if student.gender == "Male" %}selected{% endif %}>Male</option>
                            <option value="Female" {% if student.gender == "Female" %}selected{% endif %}>Female</option>
                            <option value="Other" {% if student.gender == "Other" %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="3">{{ student.address }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="active" {% if student.status == "active" %}selected{% endif %}>Active</option>
                            <option value="inactive" {% if student.status == "inactive" %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Update Student
                    </button>

                    <a href="{% url 'manage_students' %}" class="btn btn-secondary ms-2">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
