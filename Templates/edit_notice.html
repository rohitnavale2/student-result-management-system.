{% extends "admin_base.html" %}

{% block title %}Edit Notice{% endblock %}

{% block content %}
<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Edit Notice</h3>
        <a href="{% url 'manage_notices' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-12">
                        <label class="form-label">Notice Title</label>
                        <input type="text" name="title" class="form-control"
                               value="{{ notice.title }}"
                               placeholder="Enter notice title" required>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Notice Message</label>
                        <textarea name="message" class="form-control" rows="5"
                                  placeholder="Enter notice message"
                                  required>{{ notice.message }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="active"
                                {% if notice.status == "active" %}selected{% endif %}>
                                Active
                            </option>
                            <option value="inactive"
                                {% if notice.status == "inactive" %}selected{% endif %}>
                                Inactive
                            </option>
                        </select>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Update Notice
                    </button>

                    <a href="{% url 'manage_notices' %}" class="btn btn-secondary ms-2">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
