{% extends 'admin_base.html' %}

{% block title %}Edit Subject{% endblock %}

{% block content %}
<div class="container-fluid p-0">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">
            <i class="bi bi-pencil-square text-primary me-2"></i>Edit Subject
        </h2>
        <p class="text-muted mb-0">Update subject information.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'success' }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card border-0 shadow-sm" style="max-width: 750px;">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-semibold">Subject Information</h5>
        </div>

        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject Name</label>
                    <input type="text" name="subject_name" class="form-control"
                           value="{{ subject.subject_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject Code</label>
                    <input type="text" name="subject_code" class="form-control"
                           value="{{ subject.subject_code }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Class</label>
                    <select name="class_name" class="form-select" required>
                        {% for class in classes %}
                            <option value="{{ class.id }}"
                                {% if subject.class_name_id == class.id %}selected{% endif %}>
                                {{ class.class_name }} - {{ class.section }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="active"
                            {% if subject.status == "active" %}selected{% endif %}>
                            Active
                        </option>
                        <option value="inactive"
                            {% if subject.status == "inactive" %}selected{% endif %}>
                            Inactive
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-circle me-1"></i>Update Subject
                </button>

                <a href="{% url 'manage_subjects' %}"
                   class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
            </form>
        </div>
    </div>

</div>
{% endblock %}
